<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <title>Pink Love Letter</title>
        <link rel="Shortcut Icon" href="rose.png" type="image/x-icon" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
        <link rel="stylesheet" href="./style.css">
    </head>
    
    <body>
        <!-- MÀN HÌNH YÊU CẦU XOAY NGANG - CĂN GIỮA -->
        <div id="rotate-overlay" class="active">
            <div class="icon">📱</div>
            <h2>VUI LÒNG XOAY NGANG</h2>
            <p>Trải nghiệm tốt nhất ở chế độ ngang</p>
        </div>

        <!-- NỘI DUNG CHÍNH -->
        <div id="main-content">
            <canvas id="rainCanvas"></canvas>
            <canvas class="canvas" width="1820" height="905"></canvas>

            <div id="envelope-container">
                <div class="envelope-wrapper">
                    <div class="envelope new">
                        <div class="back">
                            <div class="letter">
                                <p>HAPPY BIRTHDAY!</p>
                                <!--<p>From Dzarel </p>-->
                                <p id="birthdayMessage">Happy Birthday Sayang❤️</p>

                                <!-- Thay thế bánh kem bằng hình ảnh -->
                                <div class="gift-container">
                                    <img src="gift.png" alt="Gift" class="gift-image">
                                </div>
                                <div class="frame-container">
                                    <img src="frame.png" alt="Gift" class="frame-image">
                                </div>
                            </div>
                            <div class="flip left-flip"></div>
                            <div class="flip right-flip"></div>
                            <div class="flip bottom-flip"></div>
                            <div class="flip top-flip"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SCRIPTS -->
        <script src="./jquery.min.js"></script>
        <script src="./jquery.spritely.min.js"></script>
        <script src="./script.js"></script>
    </body>
</html>
